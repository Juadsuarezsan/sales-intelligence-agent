[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intelligence-agent"
version = "0.1.0"
description = "B2B Sales Intelligence — planner-executor-reflector agent over YC companies, web search and Claude"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Juan David Suárez Sánchez", email = "juadsuarezsan@unal.edu.co" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "loguru==0.7.2",
    "anthropic==0.39.0",
    "langgraph==0.2.45",
    "tavily-python==0.5.0",
    "selectolax==0.3.21",
    "psycopg[binary,pool]==3.2.3",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "respx==0.21.1",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
    "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
include = ["src*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "T20", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D212", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "T20"]
"scripts/*" = ["T20", "E402"]
"eval/*" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(\\.venv|notebooks)"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["\\.venv", "build"]

[[tool.mypy.overrides]]
module = ["tavily.*", "selectolax.*", "slowapi.*", "langgraph.*", "langsmith.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nbformat ships no type annotations.
module = ["scripts.run_notebook"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
