# docker compose up --build
# Not validated in the development environment (no Docker daemon available);
# see README "Limitaciones conocidas".
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales_dev
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sales:sales_dev@postgres:5432/sales
      CORS_ORIGINS: http://localhost:3000,https://juadsuarezsan.github.io
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:
